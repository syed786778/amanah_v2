        // Screenshot protection
        function scrambleCanvasPixels(canvasId) {
            const canvas = document.getElementById(canvasId);

            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth || 600;
            const height = canvas.offsetHeight || 400;
            
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, 0, width, height);

            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

                    } else {

                } else {

                if (blurStartTime > 0) {
                    const blurDuration = Date.now() - blurStartTime;
                    if (blurDuration < 500 && blurDuration > 50) handleScreenshotAttempt();
                    blurStartTime = 0;
                }
            });

        // Canvas drawing
        function drawPhotoOnCanvas(canvasId, photoData, watermarkText, isLightbox = false) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                
                if (isLightbox) {
                    canvas.style.maxWidth = '100%';
                    canvas.style.maxHeight = '90vh';
                    canvas.style.width = 'auto';
                    canvas.style.height = 'auto';
                } else {
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                }
                
                ctx.drawImage(img, 0, 0, img.width, img.height);
                
                ctx.save();
                ctx.globalAlpha = 0.08;
                ctx.fillStyle = 'white';
                ctx.font = `bold ${Math.max(100, img.width / 10)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.translate(img.width / 2, img.height / 2);
                ctx.rotate(-45 * Math.PI / 180);
                ctx.fillText(watermarkText || 'Amanah Secured', 0, 0);
                ctx.restore();
            };
            
            img.onerror = () => {
                console.error(`Failed to load photo for canvas ${canvasId}`);
                ctx.fillStyle = '#333';
                canvas.style.width = '100%';
                canvas.style.height = '300px';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'red';
                ctx.font = 'bold 50px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Image Load Error', canvas.width / 2, canvas.height / 2);
            };
            
            img.src = photoData;
        }

        function copyToClipboard(text, successMsg) {
            if (navigator.clipboard?.writeText) {

            } else {
                fallbackCopy(text, successMsg);
            }
        }
        
        function fallbackCopy(text, successMsg) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert(successMsg);
            } catch (err) {
                alert('❌ Failed to copy. Please copy manually:\n\n' + text);
            }
            document.body.removeChild(textArea);
        }

        async function regenOTP() {
            if (!state.currentAlbum) return;
            
            const duration = prompt('Select OTP validity duration:\n\n1 = 24 hours (1 day)\n3 = 3 days\n6 = 6 days\n\nEnter number (1, 3, or 6):', '1');
            if (!duration) return;
            
            const durationNum = parseInt(duration);
            if (![1, 3, 6].includes(durationNum)) {
                alert('Invalid duration. Please enter 1, 3, or 6.');
                return;
            }
            
            state.loading = true;
            render();
            
            try {
                const newOtp = genOTP();
                const newExpiry = Date.now() + (durationNum * 86400000);
                
                const { error } = await supabase
                    .from('albums')
                    .update({ otp: newOtp, otp_expiry: newExpiry })
                    .eq('id', state.currentAlbum.id);
                
                if (error) throw error;
                
                state.currentAlbum.otp = newOtp;
                state.otp = newOtp;
                state.otpExpiry = newExpiry;
                state.loading = false;
                alert(`New OTP generated successfully! Access is now valid for the next ${durationNum} day(s).`);
                render();
            } catch (e) {
                console.error('OTP error:', e);
                alert('Failed to regenerate OTP: ' + e.message);
                state.loading = false;
                render();
            }
        }
        
        async function expireOTP() {
            if (!state.currentAlbum) return;
            if (!confirm('Expire OTP now? This will immediately block all access to your album.')) return;
            
            state.loading = true;
            render();
            
            try {
                const expiredTime = Date.now() - 1000;
                const { error } = await supabase
                    .from('albums')
                    .update({ otp_expiry: expiredTime })
                    .eq('id', state.currentAlbum.id);
                
                if (error) throw error;
                
                state.currentAlbum.otp_expiry = expiredTime;
                state.otpExpiry = expiredTime;
                state.loading = false;
                alert('OTP expired successfully! No one can access this album now.');
                render();
            } catch (e) {
                console.error('Expire OTP error:', e);
                alert('Failed to expire OTP: ' + e.message);
                state.loading = false;
                render();
            }
        }
        
        async function verify() {
            if (!checkVerifyFormComplete()) {
                alert('Please enter your name, a valid Album ID, and a 6-digit OTP.');
                return;
            }
            
            state.loading = true;
            render();
            
            try {
                const { data: album, error } = await supabase
                    .from('albums')
                    .select('*')
                    .eq('id', state.albumIdToView)
                    .single();
                
                if (error || !album) {
                    alert('Album not found. Please check your Album ID.');
                    state.loading = false;
                    render();
                    return;
                }
                
                if (Date.now() > album.otp_expiry) {
                    alert('OTP has expired. Please contact the album owner to regenerate it.');
                    state.loading = false;
                    render();
                    return;
                }
                
                if (album.otp !== state.viewerOtp) {
                    alert('Invalid OTP. Please check and try again.');
                    state.loading = false;
                    render();
                    return;
                }
                
                const { data: photos, error: photoError } = await supabase
                    .from('photos')
                    .select('*')
                    .eq('album_id', state.albumIdToView)
                    .order('created_at', { ascending: true });
                
                if (photoError) throw photoError;
                
                const accessLog = {
                    album_id: state.albumIdToView,
                    viewer_name: state.viewerName.trim(),
                    accessed_at: Date.now(),
                    uploader_email: album.email
                };
                
                const { error: logError } = await supabase.from('access_logs').insert(accessLog);
                if (logError) console.error('Failed to log access:', logError);
                
                state.currentAlbum = {
                    ...album,
                    photos: photos.map(p => p.photo_data),
                    photoMeta: photos.map(p => ({
                        id: p.id,
                        is_visible: p.is_visible,
                        created_at: p.created_at
                    }))
                };
                
                state.hiddenPhotos = new Set();
                photos.forEach((photo, index) => {
                    if (!photo.is_visible) state.hiddenPhotos.add(index);
                });
                
                state.isVerified = true;
                state.view = 'view';
                state.loading = false;
                state.lastSyncTime = Date.now();
                
                setupRealtimeUpdates(state.albumIdToView);
                render();
            } catch (e) {
                console.error('Verify error:', e);
                alert('Failed to verify album: ' + e.message);
                state.loading = false;
                render();
            }
        }
        
        async function delPhoto(index) {
            if (!confirm('Are you sure you want to delete this photo?')) return;
            
            state.loading = true;
            state.syncStatus = 'syncing';
            render();
            
            try {
                const photoId = state.currentAlbum.photoMeta[index]?.id;
                if (!photoId) throw new Error('Photo ID not found');
                
                const { data: allPhotos, error: countError } = await supabase
                    .from('photos')
                    .select('id')
                    .eq('album_id', state.currentAlbum.id)
                    .order('created_at', { ascending: true });
                
                if (countError) throw countError;
                
                if (allPhotos.length === 1) {
                    if (confirm('This is the last photo. Delete the entire album?')) {
                        await delAlbum();
                        return;
                    } else {
                        state.loading = false;
                        state.syncStatus = 'idle';
                        render();
                        return;
                    }
                }
                
                const { error } = await supabase.from('photos').delete().eq('id', photoId);
                if (error) throw error;
                
                state.loading = false;
                state.syncStatus = 'idle';
                alert('Photo deleted successfully');
            } catch (e) {
                console.error('Delete error:', e);
                alert('Failed to delete photo: ' + e.message);
                state.loading = false;
                state.syncStatus = 'error';
                render();
            }
        }
        
        async function delAlbum() {
            if (!confirm('Are you sure you want to delete this entire album? This action cannot be undone.')) return;
            
            state.loading = true;
            render();
            
            try {
                if (realtimeSubscription) {
                    supabase.removeChannel(realtimeSubscription);
                    realtimeSubscription = null;
                    currentAlbumId = null;
                }
                
                const { error } = await supabase.from('albums').delete().eq('id', state.currentAlbum.id);
                if (error) throw error;
                
                state.view = 'home';
                state.currentAlbum = null;
                state.loading = false;
                alert('Album deleted successfully');
                render();
            } catch (e) {
                console.error('Delete error:', e);
                alert('Failed to delete album: ' + e.message);
                state.loading = false;
                render();
            }
        }

                    </div>
                `;
            }
            
            const photo = state.currentAlbum.photos[state.lightboxIndex];
            const watermarkText = `${state.currentAlbum.name} (${state.currentAlbum.id})`;
            const canvasId = `secure-photo-lightbox`;
            
            setTimeout(() => drawPhotoOnCanvas(canvasId, photo, watermarkText, true), 50);
            
            return `
                <div id="lightbox-container" class="fixed inset-0 bg-black bg-opacity-95 z-40 flex items-center justify-center p-4">
                    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-4xl p-2 hover:text-red-500 z-50">&times;</button>
                    <div class="secure-image-container max-w-full max-h-[90vh] h-full w-full flex items-center justify-center">
                        <canvas id="${canvasId}" class="object-contain rounded-lg shadow-2xl"></canvas>
                        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-4 z-50">
                            <button onclick="prevPhoto()" ${state.lightboxIndex === 0 ? 'disabled' : ''} class="p-3 rounded-full bg-gray-700 text-white ${state.lightboxIndex === 0 ? 'opacity-50' : 'hover:bg-gray-600'}">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                            </button>
                            <span class="p-3 bg-gray-700 text-white rounded-lg font-mono text-sm">${state.lightboxIndex + 1} / ${state.currentAlbum.photos.length}</span>
                            <button onclick="nextPhoto()" ${state.lightboxIndex === state.currentAlbum.photos.length - 1 ? 'disabled' : ''} class="p-3 rounded-full bg-gray-700 text-white ${state.lightboxIndex === state.currentAlbum.photos.length - 1 ? 'opacity-50' : 'hover:bg-gray-600'}">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderReportModal() {
            if (!state.showReportModal) return '';
            
            return `
                <div class="fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-800 rounded-xl max-w-2xl w-full p-8 shadow-2xl border-2 border-red-500">
                        <div class="flex justify-between items-start mb-6">
                            <h3 class="text-3xl font-bold text-red-400">Report Content</h3>
                            <button onclick="closeReportModal()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
                        </div>
                        <div class="space-y-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-300 mb-2">Reason *</label>
                                <select onchange="state.reportReason=this.value" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white">
                                    <option value="">-- Select a reason --</option>
                                    <option value="Obscene or Inappropriate Images">Obscene or Inappropriate Images</option>
                                    <option value="Spam or Misleading Content">Spam or Misleading Content</option>
                                    <option value="Fake or Stolen Photos">Fake or Stolen Photos</option>
                                    <option value="Harassment or Threatening Content">Harassment or Threatening Content</option>
                                    <option value="Underage Individual">Underage Individual</option>
                                    <option value="Violation of Privacy">Violation of Privacy</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-300 mb-2">Additional Details</label>
                                <textarea oninput="state.reportDetails=this.value" rows="4" placeholder="Provide additional information..." class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white"></textarea>
                            </div>
                            <div class="flex space-x-4">
                                <button onclick="submitReport()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold">Submit Report</button>
                                <button onclick="closeReportModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-semibold">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function render() {
            const app = document.getElementById('app');
            let content = renderHeader();
            
            if (state.loading) {
                content += renderLoading();
            } else {
                const views = {
                    home: renderHomeView,
                    about: renderAboutView,
                    upload: renderUploadView,
                    manage: renderManageInputView,
                    gallery: renderGalleryView,
                    viewer: renderViewerInputView,
                    view: renderViewerView,
                    terms: renderTermsView
                };
                content += (views[state.view] || renderHomeView)();
            }
            
            app.innerHTML = content;
            
            if (state.showReportModal) {
                app.insertAdjacentHTML('beforeend', renderReportModal());
            }
            
            if (state.lightboxIndex !== null) {
                app.insertAdjacentHTML('beforeend', renderLightbox());
                if (state.view === 'view' && state.isVerified) {
                    setTimeout(setupProtection, 100);
                }
            } else {
                protectionActive = false;
            }
            
            setTimeout(renderSyncIndicator, 100);
        }
        
        async function initializeApp() {
            try {
                console.log('🚀 Initializing Amanah...');
                const urlParams = new URLSearchParams(window.location.search);
                const albumId = urlParams.get('album');
                
                window.addEventListener('hashchange', () => {
                    const hash = window.location.hash.slice(1);
                    state.view = hash || 'home';
                    render();
                });
                
                if (albumId) {
                    state.albumIdToView = albumId;
                    state.view = 'viewer';
                    window.location.hash = 'viewer';
                } else {
                    const hash = window.location.hash.slice(1);
                    state.view = hash || 'home';
                }
                
                console.log('✅ Amanah initialized, rendering view:', state.view);
                render();
            } catch (error) {
                console.error('❌ Initialization error:', error);
                document.getElementById('app').innerHTML = `
                    <div class="fixed inset-0 bg-gray-900 flex flex-col items-center justify-center p-4">
                        <svg class="w-16 h-16 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <h2 class="text-2xl font-bold text-white mb-2">Error Loading Amanah</h2>
                        <p class="text-gray-400 text-center mb-4">Please refresh the page or contact support.</p>
                        <button onclick="location.reload()" class="bg-purple-600 hover:bg-purple-700 text-white py-2 px-6 rounded-lg font-semibold">
                            Reload Page
                        </button>
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
